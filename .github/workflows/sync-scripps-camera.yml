name: Sync Scripps camera

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [divepro-site-deployed]

permissions:
  contents: write

concurrency:
  group: sync-scripps-camera
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out generated site data
        uses: actions/checkout@v4
        with:
          repository: patdudley/DivePro-site
          ref: main
          path: source-site

      - name: Copy current public camera pointers
        run: |
          set -euo pipefail
          mkdir -p camera-snapshots
          for status in scripps-pier-latest-attempt.json scripps-pier-last-valid.json scripps-pier-latest.json; do
            python3 -m json.tool "source-site/camera-snapshots/$status" >/dev/null
            cp "source-site/camera-snapshots/$status" "camera-snapshots/$status"
          done

      - name: Download images referenced by the pointers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          from urllib.parse import urlsplit

          for status_path in pathlib.Path("camera-snapshots").glob("scripps-pier-*.json"):
              status = json.loads(status_path.read_text())
              image_url = status.get("image_url")
              if not image_url:
                  continue
              relative = pathlib.Path(urlsplit(image_url).path.lstrip("/"))
              if relative.parts[:2] != ("camera-snapshot-history", "scripps-pier"):
                  raise RuntimeError(f"Unexpected camera image path: {relative}")
              relative.parent.mkdir(parents=True, exist_ok=True)
              source_image = pathlib.Path("source-site") / relative
              if not source_image.is_file():
                  raise RuntimeError(f"Missing source camera image: {source_image}")
              relative.write_bytes(source_image.read_bytes())
          PY

      - name: Validate forecasts and refresh crawler-visible content
        run: python3 scripts/sync_published_data.py --source source-site --destination .

      - name: Publish changed forecast and camera data
        run: |
          git add model_outputs/latest_forecast.json model_outputs/forecast_10day.json \
            model_outputs/spots/la-jolla.json forecast_history.json data/wind-cropped \
            index.html sitemap.xml camera-snapshots camera-snapshot-history
          if git diff --cached --quiet; then
            echo "Forecast and camera data are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh forecasts and Scripps camera"
          git pull --rebase
          git push
