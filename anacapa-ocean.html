            <div class="swell-map-scrim" aria-hidden="true"></div>
          </div>

            <div id="swellRose" class="swell-rose"></div>
          </figure>
        </div>
      </section>

      <section class="model-card weather-card">
        <h2>Weather</h2>
        <div class="feature-rows" id="featureRows"></div>
      </section>

      <section class="chart-grid chart-grid-single">
        <article>
          <div class="section-heading">

          </div>
          <div class="chart" id="tideChart"></div>
        </article>
      </section>

      <section class="chart-grid chart-grid-single static-wind-card">
        <article>

        </article>
      </section>

        <div class="section-heading">
          <h2>Region Map</h2>
          <span id="regionMapLabel">Channel Islands</span>
        </div>
        <div class="map-frame spot-map-frame">
          <div class="spot-map-graphic">
            <div id="spotRegionMap" class="spot-region-map" role="img" aria-label="Interactive California dive region map"></div>
            <div class="map-layer-toggle spot-map-layer-toggle" aria-label="Map layer">
              <button type="button" data-map-layer="wind" aria-pressed="true">Wind</button>
              <button type="button" data-map-layer="depth" aria-pressed="false">Depth</button>
            </div>
            <div class="wind-legend spot-wind-legend is-hidden" aria-label="Wind speed legend">

    <script>
      (function applySpotFromPath() {
        const parts = (window.location.pathname || "").split("/").filter(Boolean);
        let last = (parts.pop() || "").replace(/\.html$/i, "");
        if (!last || last === "index") last = (parts.pop() || "").replace(/\.html$/i, "");
        if (last === "Dive-Pro-Demo") last = "";
        const requested = last || "anacapa-ocean";
        const spot = window.spotFromSlug ? window.spotFromSlug(requested) : null;
        document.body.dataset.spot = spot?.slug || requested || "anacapa-ocean";
      })();
    </script>
