  <body data-spot="catalina-wrigley">
    <p class="preview-banner">Preview — not production. Live site is <a href="https://diveprosd.com">diveprosd.com</a></p>
    <header class="site-chrome">
      <div class="site-chrome-bar">
        <a class="site-logo" href="./">
          <img src="divepro-logo.png?v=logo-clear-20260827" alt="Dive Pro">
        </a>
        <nav class="site-nav" aria-label="Site">
          <a href="blog/">Blog</a>
        </nav>
      </div>
    </header>
    <main class="shell">
      <div class="stale-banner" id="staleBanner" hidden></div>
      <section class="hero-camera">
        <figure class="camera-frame is-camera-unavailable" id="cameraFrame">
          <img id="cameraImage" alt="" hidden>
          <p class="camera-unavailable-message" id="cameraUnavailableMessage">Camera unavailable · no verified recent image</p>
          <span class="camera-observed-badge" id="cameraObservedBadge" hidden>Today</span>
          <a class="camera-live-link" href="https://coollab.ucsd.edu/pierviz/" target="_blank" rel="noopener noreferrer" aria-label="Open the live Scripps Pier camera on UCSD Coollab in a new tab">Scripps Pier cam <span aria-hidden="true">&nearr;</span></a>
        </figure>

        <div class="hero-content">
          <section class="forecast-panel">
            <div class="forecast-meta">
              <label class="spot-picker">
                <span class="spot-picker-kicker">California location</span>
                <div class="spot-picker-row">
                  <button type="button" id="heroPrevSpot" class="spot-picker-nav" aria-label="Previous California location">‹</button>
                  <select id="spotPicker" aria-label="California dive location">
                    <option value="la-jolla">Scripps Beach</option>
                    <option value="monterey">Monterey</option>
                    <option value="catalina-wrigley">Wrigley Reserve</option>
                    <option value="anacapa-ocean">Anacapa Ocean</option>
                  </select>
                  <button type="button" id="heroNextSpot" class="spot-picker-nav" aria-label="Next California location">›</button>
                </div>
              </label>
            </div>
          </section>
        </div>
      </section>

      <section class="model-card wave-card swell-card">
        <div class="section-heading">
          <h2>Swell</h2>
          <span id="swellSource">Open-Meteo / NDBC</span>
        </div>
        <div class="swell-stage">
          <div class="wave-components" id="waveComponents"></div>
          <div class="swell-map-panel">
            <div id="swellMap" class="swell-map" role="img" aria-label="La Jolla coastline map"></div>
            <div class="swell-map-scrim" aria-hidden="true"></div>
            <figure class="swell-rose-wrap" aria-label="Swell compass rose">
              <div id="swellRose" class="swell-rose"></div>
            </figure>
          </div>
        </div>
      </section>

      <section class="model-card">
        <h2>Weather</h2>
        <div class="feature-rows" id="featureRows"></div>
      </section>

      <section class="chart-grid chart-grid-single">
        <article>
          <div class="section-heading">
            <h2>Tide Height</h2>
          </div>
          <div class="chart" id="tideChart"></div>
        </article>
      </section>

      <section class="chart-grid chart-grid-single static-wind-card">
        <article>
          <div class="section-heading">
            <h2>Wind Speed</h2>
            <span>mph</span>
          </div>
          <div class="chart bars" id="windChart"></div>
        </article>
      </section>

      <section class="model-card region-map-card">
        <div class="section-heading">
          <h2>Region Map</h2>
          <span id="regionMapLabel">California</span>
        </div>
        <div class="map-frame spot-map-frame">
          <div class="spot-map-graphic">
            <div id="spotRegionMap" class="spot-region-map" role="img" aria-label="Interactive California dive region map"></div>
            <div class="map-layer-toggle spot-map-layer-toggle" aria-label="Map layer">
              <button type="button" data-map-layer="wind" aria-pressed="true">Wind</button>
              <button type="button" data-map-layer="depth" aria-pressed="false">Depth</button>
            </div>
            <div class="wind-legend spot-wind-legend is-hidden" aria-label="Wind speed legend">
              <span>Wind MPH</span>
              <div class="wind-legend-gradient"></div>
              <div class="wind-legend-labels"><b>0</b><b>5</b><b>10</b><b>20+</b></div>
            </div>
            <div class="depth-legend spot-depth-legend" aria-label="Ocean depth legend">
              <span>Depth</span>
              <div class="depth-legend-gradient"></div>
              <div class="depth-legend-labels"><b>Shallow</b><b>Deep</b></div>
            </div>
          </div>
        </div>
      </section>

    </main>

    <script>
      (function applySpotFromPath() {
        const file = (window.location.pathname.split("/").pop() || "").replace(/\.html$/i, "");
        const requested = (file && file !== "index") ? file : "la-jolla";
        const spot = window.spotFromSlug ? window.spotFromSlug(requested) : null;
        document.body.dataset.spot = (file && file !== "index" && spot?.slug) ? spot.slug : "la-jolla";
      })();
    </script>
