    <main class="shell">
      <div class="stale-banner" id="staleBanner" hidden></div>

        <figure class="camera-frame is-camera-unavailable" id="cameraFrame">

          <p class="camera-unavailable-message" id="cameraUnavailableMessage">Camera unavailable · no verified recent image</p>
          <span class="camera-observed-badge" id="cameraObservedBadge" hidden>Today</span>
          <a class="camera-live-link" href="https://coollab.ucsd.edu/pierviz/" target="_blank" rel="noopener noreferrer" aria-label="Open the live Scripps Pier camera on UCSD Coollab in a new tab">Scripps Pier cam <span aria-hidden="true">&nearr;</span></a>
        </figure>

        <div class="hero-content">
          <section class="forecast-panel">
            <div class="forecast-meta">
              <div class="spot-heading">
                <p class="spot-heading-name" id="spotHeading">La Jolla</p>
              </div>
            </div>
            <div class="forecast-main">
              <strong id="grade">--</strong>
              <div class="primary-stat">
                <span>Estimated visibility</span>
                <strong id="visibility">-- ft</strong>
              </div>
            </div>
            <div class="score-row">
              <div class="score-track" aria-hidden="true"><div id="scoreFill"></div></div>
            </div>
            <div class="wave-weight">
              <span>Wave weight</span>
              <strong id="waveWeight">Loading</strong>
            </div>
            <div class="best-window">
              <span>Best window</span>
              <strong id="bestWindow">Loading</strong>
            </div>
          </section>

          <section class="daily-report-card">
            <article class="report-copy">
              <h2>Daily Dive Report</h2>
              <p id="dailyReport"></p>
            </article>
          </section>
        </div>
      </section>

      <section class="model-card wave-card swell-card">
        <div class="section-heading">
          <h2>Swell</h2>
        </div>
        <div class="swell-stage swell-visualization">
          <div class="wave-components" id="waveComponents"></div>
          <div class="swell-map-panel">
            <div id="swellMap" class="swell-map" role="img" aria-label="La Jolla coastline map"></div>
            <div class="swell-map-scrim" aria-hidden="true"></div>
          </div>
          <figure class="swell-compass-overlay swell-rose-wrap" aria-label="Swell compass rose">
            <div id="swellRose" class="swell-rose"></div>
          </figure>
        </div>
      </section>

      <section class="model-card weather-card">
        <h2>Weather</h2>
        <div class="feature-rows" id="featureRows"></div>
      </section>

      <section class="chart-grid chart-grid-single">
        <article>
          <div class="section-heading">
            <h2>Tide Height</h2>
          </div>
          <div class="chart" id="tideChart"></div>
        </article>
      </section>

      <section class="chart-grid chart-grid-single static-wind-card">
        <article>
          <div class="section-heading">
            <h2>Wind Speed</h2>
            <span>mph</span>
          </div>
          <div class="chart bars" id="windChart"></div>
        </article>
      </section>

      <section class="model-card region-map-card">
        <div class="section-heading">
          <h2>Region Map</h2>
          <span id="regionMapLabel">La Jolla, San Diego</span>
        </div>
        <div class="map-frame spot-map-frame">
          <div class="spot-map-graphic">
            <div id="spotRegionMap" class="spot-region-map" role="img" aria-label="Interactive California dive region map"></div>
            <div class="map-layer-toggle spot-map-layer-toggle" aria-label="Map layer">
              <button type="button" data-map-layer="wind" aria-pressed="true">Wind</button>
              <button type="button" data-map-layer="depth" aria-pressed="false">Depth</button>
            </div>
            <div class="wind-legend spot-wind-legend is-hidden" aria-label="Wind speed legend">
              <span>Wind MPH</span>
              <div class="wind-legend-gradient"></div>
              <div class="wind-legend-labels"><b>0</b><b>5</b><b>10</b><b>20+</b></div>
            </div>
          </div>
        </div>
      </section>

      <section class="ten-day-card">
        <div class="section-heading">
          <h2>10 Day Forecast</h2>
          <span id="forecastSource">Model predictions</span>
        </div>
        <div class="forecast-strip" id="forecastStrip" aria-label="10 day visibility forecast"></div>

    <script>
      (function applySpotFromPath() {
        const parts = (window.location.pathname || "").split("/").filter(Boolean);
        let last = (parts.pop() || "").replace(/\.html$/i, "");
        if (!last || last === "index") last = (parts.pop() || "").replace(/\.html$/i, "");
        if (last === "Dive-Pro-Demo") last = "";
        const requested = last || "la-jolla";
        const spot = window.spotFromSlug ? window.spotFromSlug(requested) : null;
        document.body.dataset.spot = spot?.slug || requested || "la-jolla";
      })();
    </script>
