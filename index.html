  <body class="home-directory" data-page="home">
    <p class="preview-banner">Preview — not production. Live site is <a href="https://diveprosd.com">diveprosd.com</a></p>
    <header class="site-chrome">
      <div class="site-chrome-bar">
        <a class="site-logo" href="./">
          <img src="divepro-logo.png?v=logo-clear-20260827" alt="Dive Pro">
        </a>
        <nav class="site-nav" aria-label="Site">
          <a href="blog/">Blog</a>
        </nav>
      </div>
    </header>
    <main class="shell home-directory-shell">
      <form class="home-search" id="spotSearchForm" role="search">
        <label class="home-search-label" for="spotSearch">Search spots</label>
        <input id="spotSearch" type="search" name="q" placeholder="Search spots" autocomplete="off" enterkeyhint="search">
      </form>

      <div class="home-spot-layout">
        <section class="model-card region-map-card home-map-card">
          <div class="section-heading">
            <h2>California</h2>
            <span id="regionMapLabel">Four dive spots</span>
          </div>
          <div class="map-frame spot-map-frame">
            <div class="spot-map-graphic">
              <div id="spotRegionMap" class="spot-region-map" role="img" aria-label="Interactive California dive region map"></div>
              <div class="map-layer-toggle spot-map-layer-toggle" aria-label="Map layer">
                <button type="button" data-map-layer="wind" aria-pressed="true">Wind</button>
                <button type="button" data-map-layer="depth" aria-pressed="false">Depth</button>
              </div>
              <div class="wind-legend spot-wind-legend is-hidden" aria-label="Wind speed legend">
                <span>Wind MPH</span>
                <div class="wind-legend-gradient"></div>
                <div class="wind-legend-labels"><b>0</b><b>5</b><b>10</b><b>20+</b></div>
              </div>
              <div class="depth-legend spot-depth-legend" aria-label="Ocean depth legend">
                <span>Depth</span>
                <div class="depth-legend-gradient"></div>
                <div class="depth-legend-labels"><b>Shallow</b><b>Deep</b></div>
              </div>
            </div>
          </div>
        </section>

        <section class="home-bubbles-card" aria-label="California locations">
          <div id="spotBubbles" class="home-bubbles"></div>
          <p class="home-search-empty" id="spotSearchEmpty" hidden>No spots match that search.</p>
        </section>
      </div>
